[package]
name = "multisig-cli"
description = "msig — the LP-0002 command line client: build member sets, derive commitments, emit spel argument files."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
multisig-core = { path = "../multisig-core" }
multisig-sdk = { path = "../multisig-sdk" }
# risc0-serde encoding of the witness, exactly as the guest reads it.
risc0-zkvm = { version = "3.0.5", default-features = false }
anyhow = { workspace = true }
clap = { workspace = true }
hex = { workspace = true, features = ["std"] }
rand = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }

[[bin]]
name = "msig"
path = "src/bin/msig.rs"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
